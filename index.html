<title>S’organiser et résister</title>

<meta property="og:description" content="Boîte à outils : droits face à la police et à la justice (Suisse romande), actions non violentes, fiches théoriques, réduction des risques, démêler le vrai du faux, remèdes naturels avec niveau de preuve. Gratuit, sans compte, utilisable hors ligne.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c62418'/%3E%3Crect x='14' y='6' width='4' height='20' fill='white'/%3E%3Crect x='6' y='14' width='20' height='4' fill='white'/%3E%3C/svg%3E">
<style>
html{color-scheme:light dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* S’organiser et résister — direction : affiche typographique suisse.
   Grotesque système, filets noirs épais, un seul rouge, angles droits. Mise en page : une colonne de lecture, navigation en bas sur mobile, à gauche sur grand écran. */
:root {
  --paper: #f4f5f6;
  --surface: #ffffff;
  --surface2: #e9ebee;
  --ink: #101114;
  --muted: #484d55;
  --line: #101114;
  --hair: #c9cdd3;
  --red: #b71f12;
  --red-solid: #c62418;
  --on-red: #ffffff;
  --blue: #1b4a8a;
  --ok: #17603d;
  --ok-bg: #e2f1e8;
  --warn: #6b4500;
  --warn-bg: #fff1cf;
  --info-bg: #e3ecf8;
  --focus: #0a58ff;
  --shadow: #101114;
  --font: "Helvetica Neue", Helvetica, "Segoe UI", system-ui, -apple-system, Roboto, Arial, "Liberation Sans", sans-serif;
  --font-read: var(--font);
  --lh: 1.6;
  --ls: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1013; --surface: #171a1f; --surface2: #22262c; --ink: #f1f2f4; --muted: #b9bec6;
    --line: #f1f2f4; --hair: #3a4048; --red: #ff7d6e; --red-solid: #c62418; --blue: #8db8ff;
    --ok: #7fd6a3; --ok-bg: #12301f; --warn: #ffd37a; --warn-bg: #3a2c08; --info-bg: #15263d;
    --focus: #8db8ff; --shadow: #f1f2f4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1013; --surface: #171a1f; --surface2: #22262c; --ink: #f1f2f4; --muted: #b9bec6;
  --line: #f1f2f4; --hair: #3a4048; --red: #ff7d6e; --red-solid: #c62418; --blue: #8db8ff;
  --ok: #7fd6a3; --ok-bg: #12301f; --warn: #ffd37a; --warn-bg: #3a2c08; --info-bg: #15263d;
  --focus: #8db8ff; --shadow: #f1f2f4; color-scheme: dark;
}
/* Contraste élevé : noir et blanc, jaune pour ce qui s’active */
:root.hc, :root.hc[data-theme] {
  --paper: #000; --surface: #000; --surface2: #111; --ink: #fff; --muted: #fff; --line: #fff; --hair: #fff;
  --red: #ffb3a8; --red-solid: #b00020; --blue: #ffe94d; --ok: #9dffc4; --ok-bg: #000; --warn: #ffe94d; --warn-bg: #000;
  --info-bg: #000; --focus: #ffe94d; --shadow: #fff; color-scheme: dark;
}
:root.f-comfort { --font: Verdana, Tahoma, "Trebuchet MS", "DejaVu Sans", sans-serif; --lh: 1.9; --ls: .02em; }

[hidden] { display: none !important; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* , *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 1.0625rem; line-height: var(--lh); letter-spacing: var(--ls);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-wrap: break-word; hyphens: manual;
}
:root.f-comfort body { word-spacing: .1em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -80px; z-index: 100; background: var(--ink); color: var(--paper); padding: .6rem 1rem; font-weight: 700; }
.skip:focus { top: 8px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
a { color: var(--blue); text-underline-offset: .18em; text-decoration-thickness: 1.5px; }
a:hover { text-decoration-thickness: 3px; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
strong { font-weight: 750; }
em { font-style: italic; }
p { margin: 0 0 .9em; max-width: 68ch; }
ul, ol { margin: 0; padding: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* — Armature — */
.app { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 78rem; margin: 0 auto; min-height: 100vh; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper);
  display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap;
  padding-block: .6rem; border-bottom: 4px solid var(--line);
}
.brand { text-decoration: none; display: flex; align-items: center; gap: .6rem; background: none; border: 0; padding: .25rem; text-align: left; color: var(--ink); min-height: 44px; }
.mark { width: 1.9rem; height: 1.9rem; background: var(--red-solid); position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; background: #fff; }
.mark::before { left: 50%; top: 20%; width: 14%; height: 60%; transform: translateX(-50%); }
.mark::after { top: 50%; left: 20%; height: 14%; width: 60%; transform: translateY(-50%); }
.brand-t { font-weight: 800; letter-spacing: -.01em; line-height: 1.05; font-size: 1.02rem; }
.tools { display: flex; align-items: center; gap: .25rem; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 2px solid transparent; color: var(--ink); border-radius: 2px; }
.icon-btn:hover { border-color: var(--line); }
.icon-btn svg, .ico { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.urg { min-height: 44px; padding: .3rem .9rem; background: var(--red-solid); color: var(--on-red); border: 2px solid var(--red-solid); font-weight: 800; letter-spacing: .02em; display: inline-flex; align-items: center; gap: .4rem; border-radius: 2px; margin-left: .25rem; }
.urg:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 4px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav a {
  background: none; border: 0; padding: .5rem .1rem .45rem; display: flex; flex-direction: column; align-items: center; gap: .15rem; min-height: 58px;
  font-size: .78rem; font-weight: 700; color: var(--muted); border-top: 4px solid transparent; margin-top: -4px; text-decoration: none;
}
.nav a[aria-current="page"] { color: var(--ink); border-top-color: var(--red-solid); }
.nav a:hover { color: var(--ink); }
main { padding-block: 1.25rem 7.5rem; min-width: 0; outline: none; }
main > * + * { margin-top: 1.5rem; }
#view > * + * { margin-top: 1.5rem; }

@media (min-width: 56rem) {
  .app { grid-template-columns: 13.5rem minmax(0, 1fr); column-gap: 2.5rem; }
  .top { grid-column: 1 / -1; }
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 5.5rem); align-self: start; grid-column: 1; grid-row: 2; display: flex; flex-direction: column; border: 0; border-right: 4px solid var(--line); background: none; padding: 1rem 0 0; left: auto; right: auto; bottom: auto; margin-top: 1rem; }
  .nav a { flex-direction: row; justify-content: flex-start; gap: .8rem; font-size: 1rem; padding: .7rem .8rem; border-top: 0; margin: 0; border-right: 6px solid transparent; margin-right: -4px; }
  .nav a[aria-current="page"] { border-top-color: transparent; border-right-color: var(--red-solid); background: var(--surface); }
  main { grid-column: 2; grid-row: 2; padding-bottom: 4rem; max-width: 50rem; }
}

/* — Typographie — */
h1 { font-size: clamp(1.9rem, 6.5vw, 2.9rem); line-height: 1.04; font-weight: 800; letter-spacing: -.025em; }
h2 { font-size: clamp(1.3rem, 4vw, 1.65rem); line-height: 1.15; font-weight: 800; letter-spacing: -.015em; }
h3 { font-size: 1.1rem; line-height: 1.25; font-weight: 750; }
.eyebrow { font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .6rem; }
.eyebrow::after { content: ""; flex: 1; height: 2px; background: var(--hair); }
.lead { font-size: 1.15rem; max-width: 40ch; color: var(--muted); }
.small { font-size: .9rem; color: var(--muted); }
.repere { margin: .6rem 0 1.1rem; }
.title-row { display: flex; flex-direction: column; gap: .6rem; }
.title-row h1 { padding-top: .2rem; }
.rule { border: 0; border-top: 4px solid var(--line); margin: 0; }

/* — Accueil — */
.hero h1 { font-size: clamp(2.4rem, 10vw, 4.6rem); line-height: .96; letter-spacing: -.035em; }
.hero h1 span { display: block; }
.hero h1 .r { color: var(--red); }
.hero .lead { margin-top: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.pill { display: inline-flex; align-items: center; gap: .35rem; border: 2px solid var(--line); padding: .15rem .65rem; font-size: .85rem; font-weight: 700; background: var(--surface); border-radius: 2px; }

/* — Tuiles — */
.grid { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
.tile {
  display: flex; flex-direction: column; gap: .35rem; align-items: flex-start; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--line); padding: 1rem 1rem 1.05rem; border-radius: 2px; color: var(--ink); text-decoration: none;
  transition: transform .12s ease, box-shadow .12s ease;
}
.tile:hover { transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--shadow); }
.tile .ico { color: var(--red); width: 1.7rem; height: 1.7rem; }
.tile .th { font-size: 1.12rem; }
.tile p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.4; }
.tile.hot { background: var(--red-solid); color: var(--on-red); border-color: var(--red-solid); }
.tile.hot p, .tile.hot .ico { color: var(--on-red); }
.tile.hot:hover { box-shadow: 5px 5px 0 var(--shadow); }
.tile.big .th { font-size: 1.3rem; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }

/* — Boutons — */
.btn {
  display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; padding: .45rem 1rem; font-weight: 750; text-decoration: none;
  background: var(--ink); color: var(--paper); border: 2px solid var(--ink); border-radius: 2px;
}
.btn:hover { background: var(--paper); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--ink); color: var(--paper); }
.btn.red { background: var(--red-solid); border-color: var(--red-solid); color: var(--on-red); }
.btn.red:hover { background: var(--paper); color: var(--red); }
.btn.sm { min-height: 40px; padding: .25rem .75rem; font-size: .92rem; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btns { display: flex; flex-wrap: wrap; gap: .6rem; }
.back { display: inline-flex; align-items: center; gap: .4rem; font-weight: 750; background: none; border: 0; padding: .4rem 0; min-height: 44px; color: var(--blue); text-decoration: underline; text-underline-offset: .18em; }

/* — Barre d’outils de page — */
.viewtools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
.viewtools .btns { margin-left: auto; }

/* — Blocs de contenu — */
.chip { display: inline-block; font-size: .8rem; font-weight: 700; padding: .05rem .5rem; border: 1.5px dashed var(--muted); color: var(--muted); border-radius: 2px; background: var(--surface); font-variant-numeric: tabular-nums; }
.chiplist { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; }
.list { list-style: none; display: grid; gap: .65rem; }
.list li { position: relative; padding-left: 1.4rem; max-width: 68ch; }
.list li::before { content: ""; position: absolute; left: 0; top: .6em; width: .6rem; height: .6rem; background: var(--red-solid); }
.sec { display: grid; gap: .75rem; }
.sec > .sh { margin-top: .4rem; }
.sh, .th { font-size: 1.15rem; line-height: 1.25; font-weight: 800; letter-spacing: -.005em; }
.note { border: 2px solid var(--line); border-top-width: 8px; padding: .8rem 1rem 1rem; background: var(--surface); max-width: 68ch; border-radius: 0; }
.note .lab { display: block; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; margin-bottom: .25rem; }
.note p:last-child { margin-bottom: 0; }
.note.warn { background: var(--warn-bg); border-color: var(--warn); }
.note.warn .lab { color: var(--warn); }
.note.info { background: var(--info-bg); border-color: var(--blue); }
.note.info .lab { color: var(--blue); }
.note.key .lab { color: var(--red); }
.defs { display: grid; gap: .9rem; margin: 0; }
.defs div { border-top: 2px solid var(--hair); padding-top: .6rem; max-width: 68ch; }
.defs dt { font-weight: 800; margin-bottom: .15rem; }
.defs dd { margin: 0; }
.reflexes { list-style: none; counter-reset: r; display: grid; gap: .8rem; }
.reflexes li { counter-increment: r; display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: .8rem; padding: .85rem 1rem .9rem 0; border-top: 4px solid var(--line); background: transparent; }
.reflexes li::before { content: counter(r); font-size: 2.6rem; font-weight: 800; line-height: .9; color: var(--red); font-variant-numeric: tabular-nums; }
.reflexes strong { display: block; font-size: 1.12rem; }
.reflexes span { color: var(--muted); }
.cinqd { list-style: none; display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 13rem), 1fr)); }
.cinqd li { display: grid; grid-template-columns: 2.4rem 1fr; gap: .7rem; align-items: start; border: 2px solid var(--line); padding: .6rem .8rem; background: var(--surface); }
.cinqd .d { font-size: 2.2rem; font-weight: 800; line-height: .95; color: var(--red); }
.easy { border: 2px solid var(--ok); background: var(--ok-bg); padding: .1rem 1rem; }
.easy summary { cursor: pointer; font-weight: 800; padding: .7rem 0; min-height: 44px; color: var(--ok); }
.easy ul { margin-bottom: .9rem; }
.easy li { font-size: 1.12rem; line-height: 1.7; }
:root.easy-on .easy { padding-bottom: .1rem; }
.pr { border: 2px solid var(--ok); background: var(--ok-bg); padding: .8rem 1rem 1rem; max-width: 68ch; }
.pr .sh { color: var(--ok); }
.lim { border: 2px solid var(--warn); background: var(--warn-bg); padding: .8rem 1rem 1rem; max-width: 68ch; }
.lim .sh { color: var(--warn); }
.pr .list, .lim .list { margin-top: .6rem; }
.pr .list li::before { background: var(--ok); }
.lim .list li::before { background: var(--warn); }
.refs { font-size: .9rem; color: var(--muted); border-top: 2px solid var(--hair); padding-top: .8rem; max-width: 68ch; }

/* — Niveaux — */
.filters { display: flex; flex-wrap: wrap; gap: .5rem; }
.levels { list-style: none; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
.level { border: 2px solid var(--line); background: var(--surface); padding: .8rem 1rem 1rem; display: grid; gap: .45rem; align-content: start; }
.level h3 { font-size: 1.05rem; }
.level .meta { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; font-size: .88rem; color: var(--muted); }
.risk { display: inline-flex; align-items: center; gap: .4rem; font-weight: 800; font-size: .82rem; padding: .05rem .5rem; border: 2px solid currentColor; }
.risk i { display: inline-flex; gap: 2px; }
.risk i b { width: .5rem; height: .9rem; border: 1.5px solid currentColor; display: block; }
.risk i b.on { background: currentColor; }
.risk.r0 { color: var(--ok); } .risk.r1 { color: var(--warn); } .risk.r2 { color: var(--warn); } .risk.r3 { color: var(--red); }
.level .step { font-size: .98rem; }
.level .btn { justify-self: start; }

/* — Fiches, listes — */
.group { display: grid; gap: .8rem; }
.fiche-link { display: grid; gap: .25rem; }
.tabs { display: flex; flex-wrap: wrap; gap: .4rem; border-bottom: 4px solid var(--line); padding-bottom: 0; }
.tabs a { display: inline-flex; align-items: center; background: none; border: 2px solid var(--line); border-bottom: 0; padding: .45rem .9rem; font-weight: 750; min-height: 44px; border-radius: 2px 2px 0 0; color: var(--ink); text-decoration: none; }
.tabs a:hover { background: var(--surface2); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.searchbox { display: flex; gap: .5rem; flex-wrap: wrap; }
input[type="text"], input[type="search"], input[type="date"], input[type="datetime-local"], input[type="number"], select, textarea {
  background: var(--surface); border: 2px solid var(--line); border-radius: 2px; padding: .55rem .7rem; min-height: 44px; width: 100%; max-width: 36rem;
}
textarea { min-height: 6.5rem; resize: vertical; line-height: 1.5; }
label { font-weight: 750; display: block; margin-bottom: .25rem; }
.field { display: grid; gap: .1rem; }
.bib { list-style: none; display: grid; gap: 1rem; }
.bib li { border-top: 2px solid var(--hair); padding-top: .7rem; max-width: 68ch; display: grid; gap: .3rem; }
.bib .note-b { color: var(--muted); margin: 0; }
.bib .acts { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.tag { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); border: 1.5px solid var(--blue); padding: 0 .4rem; width: fit-content; }
.check { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; min-height: 44px; cursor: pointer; margin: 0; }
input[type="checkbox"], input[type="radio"] { width: 1.4rem; height: 1.4rem; accent-color: var(--red-solid); flex: none; }
.gl { display: grid; gap: .9rem; margin: 0; }
.gl div { border-top: 2px solid var(--hair); padding-top: .6rem; max-width: 68ch; }
.gl dt { font-weight: 800; }
.gl dd { margin: .1rem 0 0; }
.gl .more { margin-top: .3rem; }

/* — Outils — */
.panel { border: 2px solid var(--line); background: var(--surface); padding: 1rem; display: grid; gap: .9rem; }
.table-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .55rem .7rem; border-bottom: 2px solid var(--hair); vertical-align: top; }
th { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); }
.num { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.num.red { color: var(--red); }
.timeline { list-style: none; display: grid; gap: .7rem; }
.timeline li { display: grid; gap: .1rem; border: 2px solid var(--line); background: var(--surface); padding: .7rem .9rem; }
.timeline .when { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.timeline .left { font-variant-numeric: tabular-nums; font-weight: 700; }
.timeline li.over { border-color: var(--red); } .timeline li.over .left { color: var(--red); }
.result { border: 4px solid var(--line); padding: 1rem; background: var(--surface); display: grid; gap: .4rem; }
.result .big { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; letter-spacing: -.015em; line-height: 1.1; }
.checklist { list-style: none; display: grid; gap: .1rem; }
.checklist li { border-bottom: 2px solid var(--hair); }
.checklist .check { width: 100%; padding: .3rem 0; }
.entries { list-style: none; display: grid; gap: .5rem; }
.entries li { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; border: 2px solid var(--line); background: var(--surface); padding: .4rem .6rem; }
.entries li[aria-current="true"] { background: var(--ink); color: var(--paper); }
.entries .grow { flex: 1; min-width: 8rem; background: none; border: 0; text-align: left; font-weight: 700; padding: .3rem 0; min-height: 40px; color: inherit; }
.status { min-height: 1.4em; font-weight: 700; color: var(--ok); }
.poche h2 { font-size: 1.3rem; }
.num-table th[scope="row"] { font-size: 1.7rem; font-weight: 800; letter-spacing: 0; text-transform: none; color: var(--red); width: 6.5rem; font-variant-numeric: tabular-nums; border-bottom: 2px solid var(--hair); white-space: nowrap; }
.num-table td { font-size: 1.05rem; }
.mine input { max-width: none; }
.sticker { position: relative; }

/* — Dialogues — */
dialog { border: 4px solid var(--line); padding: 0; background: var(--paper); color: var(--ink); max-width: min(34rem, calc(100vw - 24px)); width: 100%; max-height: calc(100vh - 24px); overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 1rem; border-bottom: 4px solid var(--line); position: sticky; top: 0; background: var(--paper); }
.dlg-b { padding: 1rem; display: grid; gap: 1rem; }
.urgence-list { list-style: none; display: grid; gap: .6rem; }
.urgence-list li { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr) auto; gap: .8rem; align-items: center; border: 2px solid var(--line); padding: .5rem .8rem; background: var(--surface); }
.urgence-list .n { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--red); letter-spacing: 0; }
.urgence-list a.call { font-weight: 800; }
.results { list-style: none; display: grid; gap: .5rem; }
.results button { width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); padding: .6rem .8rem; display: grid; gap: .15rem; border-radius: 2px; }
.results button:hover { background: var(--surface2); }
.results .where { font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
.results .snip { color: var(--muted); font-size: .92rem; line-height: 1.4; }

/* — Réglages — */
.opt-row { display: flex; flex-wrap: wrap; gap: .5rem; }
.settings { display: grid; gap: 1.2rem; }
fieldset { border: 2px solid var(--line); margin: 0; padding: .8rem 1rem 1rem; display: grid; gap: .6rem; min-width: 0; }
legend { font-weight: 800; padding: 0 .4rem; }

/* — Masquer — */
#mask { position: fixed; inset: 0; z-index: 1000; background: #fff; color: #222; }
#mask button { position: absolute; right: 12px; bottom: 12px; opacity: .35; background: #f1f1f1; border: 1px solid #bbb; color: #222; min-height: 44px; padding: 0 .9rem; border-radius: 2px; }
#mask button:focus-visible, #mask button:hover { opacity: 1; }

/* — Impression — */
@media print {
  :root { --paper: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #000; --hair: #999; --red: #a01000; --blue: #000; color-scheme: light; }
  body { background: #fff; color: #000; font-size: 11pt; padding: 0; }
  body::before, .top, .nav, .viewtools, .back, .no-print, dialog, .skip, #mask { display: none !important; }
  .app { display: block; max-width: none; }
  main { padding: 0; max-width: none; }
  a { color: #000; text-decoration: none; }
  .tile, .panel, .note, .result, .level, .timeline li { box-shadow: none !important; break-inside: avoid; }
  details > *:not(summary) { display: block !important; }
  h1 { font-size: 22pt; }
  .reflexes li { break-inside: avoid; }
}

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5.6rem + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--paper); font-weight: 750; padding: .6rem 1rem; border-radius: 2px; max-width: calc(100vw - 32px); }
@media (min-width: 56rem) { .toast { bottom: 2rem; } }

[tabindex="-1"]:focus { outline: none; }
.toprow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .25rem .75rem; }
.toprow .btns { margin-left: auto; }
details.refsd { max-width: 68ch; }
details.refsd summary { cursor: pointer; font-weight: 750; min-height: 44px; display: flex; align-items: center; color: var(--muted); }
details.refsd .chiplist { padding: .2rem 0 .6rem; }
.kicker { font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
@media (max-width: 28rem) { .brand-t { display: none; } }

/* ---- Brouillon v2.0 ---- */
.nav a { min-width: 0; }
@media (max-width: 30rem) { .nav a { font-size: .68rem; } }
.alertbox { border: 2px solid var(--red-solid); background: var(--surface); padding: 1rem; display: grid; gap: .6rem; }
.alertbox .sh { color: var(--red); margin: 0; }
.urgbox dl.defs { display: grid; gap: .5rem; margin: 0; }
.urgbox dl.defs > div { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: .6rem; align-items: baseline; }
.urgbox dt { font-size: 1.35rem; font-weight: 800; color: var(--red); }
.urgbox dd { margin: 0; }


/* ---- Brouillon v2.0 : Se rapprocher du naturel ---- */
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; margin: 0; }
.pill.lvl { white-space: normal; text-align: left; line-height: 1.25; }
.pill.lvl-moy { border-color: var(--ok); background: var(--ok-bg); }
.pill.lvl-lim { border-style: dashed; }
.pill.lvl-faib { border-style: dotted; border-color: var(--warn); background: var(--warn-bg); }
.pill.lvl-dec { border-color: var(--red-solid); background: var(--warn-bg); }
.pill.lvl-non { border-style: dotted; color: var(--muted); }
.extlinks { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.extlinks li { border-bottom: 1px solid var(--hair); padding-bottom: .5rem; min-width: 0; }
.extlinks a { font-weight: 700; overflow-wrap: anywhere; }
.extlinks .xn { display: block; color: var(--muted); font-size: .9rem; }

        ["Domination, jeu d’acteur et fantasme", "Le texte public transforme la vie sociale en théâtre : la subordination exige une interprétation crédible d’humilité, la domination une interprétation crédible de supériorité, sous peine de sanction (ridicule pour le dominant, renvoi ou coups pour le dominé). Plus le pouvoir est menaçant, plus les rôles sont stéréotypés et ritualisés ; quand il s’érode, les dominés introduisent du jeu dans leur rôle. Les dominants, eux, doivent cacher leurs coulisses."],
        ["Le texte public comme représentation respectable", "Les dominants défendent leur texte public et surveillent le texte caché des dominés : secret sur les ressorts réels de la politique, euphémismes, grandes liturgies politiques ou religieuses de légitimation, surveillance, atomisation du groupe dominé. La frontière entre public et caché n’est pas un mur : c’est une zone de lutte permanente, et la capacité des dominants à décider de ce qui est public est un bon indice de leur pouvoir."],
        ["Fausse conscience, ou en rajouter une couche ?", "Chapitre de critique des théories de l’hégémonie culturelle (Gramsci, Bourdieu entre autres). La version « épaisse » dit que les dominés croient les valeurs qui justifient leur sort ; la version « mince » dit qu’ils les acceptent parce que leur situation leur paraît inévitable. Pour Scott, ces deux lectures prennent le texte public pour argent comptant : la peur des sanctions explique mieux l’absence de révolte ouverte, et des dominés qui semblent croire à l’ordre peuvent s’en servir (le mythe du « tsar juste » en Russie : on se révolte au nom du souverain contre ses administrateurs)."],
        ["Faire place à une sous-culture dissidente", "Un texte caché a besoin d’espaces à l’abri du pouvoir et de personnes pour le porter. Scott s’intéresse aux cultures populaires et à l’oralité, et aux religiosités populaires : utopies messianiques ou millénaristes d’un renversement de l’ordre du monde, par lesquelles les dominés peuvent imaginer une inversion des hiérarchies, voire leur absence, même sans projet politique précis."],
        ["La voix sous la domination : les arts du déguisement politique", "Entre le texte public et le texte caché se tient un troisième niveau : une politique du déguisement et de l’anonymat qui se déroule sous les yeux de tous mais à double sens, ou en cachant l’identité des auteur·es. Exemples : contes et chansons où des animaux rusés se vengent, rumeurs, actions anonymes, « parler dans sa barbe », rituels d’inversion."],
        ["L’infrapolitique des groupes subalternes", "Les « formes discrètes de résistance qui n’osent pas dire leur nom » : braconnage, glanage non autorisé, loyers en nature réduits, défrichements clandestins, vol, sabotage, travail bâclé, fuite. Les dominés ont intérêt à éviter l’affrontement et à résister quand même : l’infrapolitique résout cette tension. Scott répond à Barrington Moore (les rituels et fantasmes de revanche serviraient de soupape de sécurité) : le texte caché n’est pas qu’un substitut, c’est un adjuvant de la résistance matérielle, et des rituels d’inversion comme le carnaval ont aussi précédé des révoltes."],
        ["Saturnales du pouvoir : la première déclaration publique du texte caché", "Comment passe-t-on de l’insubordination voilée à la révolte ouverte ? Le rapport de forces n’est jamais connu exactement : chaque camp le teste par sondages (un vol plus audacieux, un mot à la limite de la provocation, un ordre plus arbitraire). Quand surveillance ou sanctions se relâchent, une brèche s’ouvre. Celui ou celle qui lance le texte caché à la face du pouvoir parle alors au nom du groupe, ce qui aide à comprendre la rapidité de certaines mobilisations et leur allure désordonnée."],
